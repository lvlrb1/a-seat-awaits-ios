# Per-function deploy settings. Gateway-level verify_jwt is disabled here:
# apple-webhook authenticates App Store notifications from their signed payload,
# while authenticated functions verify the JWT themselves via requireUser() so
# they can return a structured 401 instead of an opaque gateway error.

project_id = "a-seat-awaits"

[functions.apple-iap-sync]
verify_jwt = false

[functions.apple-pass-sync]
verify_jwt = false

[functions.apple-webhook]
verify_jwt = false

[functions.account-delete]
verify_jwt = false
